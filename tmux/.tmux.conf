# Shell
set -g default-command /bin/zsh

# General
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g default-terminal "screen-256color"
set -g focus-events on
set -g allow-passthrough on
setw -g aggressive-resize on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# Indexing
set -g base-index 1
setw -g pane-base-index 1

# Key mode
set -g status-keys emacs
setw -g mode-keys vi

# Status bar
set -g status-interval 1

# Window navigation
bind C-p previous-window
bind C-n next-window
bind R source-file "~/.config/tmux/tmux.conf" \; display "tmux.conf reloaded!"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'nordtheme/tmux'
set -g @nord_tmux_show_status_content 0
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @fingers-jump-key F1

# Splits — new panes inherit current working directory
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind-key -T prefix C-g split-window \
  "$SHELL --login -i -c 'navi --print | head -c -1 | tmux load-buffer -b tmp - ; tmux paste-buffer -p -t {last} -b tmp -d'"

# Copy mode
unbind [
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe 'reattach-to-user-namespace pbcopy' \; display-message "copied to system clipboard"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind ] run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

# Scratch popup
bind Q display-popup -E "tmux new-session -A -s scratch; tmux set-option -g status"

# Vim-tmux-navigator — https://github.com/christoomey/vim-tmux-navigator
# (-wrapped)? is required on macOS when nvim is launched via a GUI wrapper
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" -eq 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" -eq 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Pane resize
bind -r -T prefix K resize-pane -U 5
bind -r -T prefix J resize-pane -D 5
bind -r -T prefix H resize-pane -L 5
bind -r -T prefix L resize-pane -R 5

run '~/.config/tmux/plugins/tpm/tpm'

# Status bar (after plugins — nord otherwise overwrites status-right)
set -g status-style 'bg=default,fg=default'
set -g status-left-style 'bg=default,fg=default'
set -g status-right-style 'bg=default,fg=default'
set -g status-justify left
set -g status-left-length 90
set -g status-right-length 120
set -g status-left '#(cat #{socket_path}-\#{session_id}-vimbridge)'
set -g status-right '#{battery_icon} #{battery_graph} #{battery_percentage} #{battery_remain} #(cat #{socket_path}-\#{session_id}-vimbridge-R)'
set -g @batt_remain_short true

# Nord window list + prefix-highlight use bg=black in separators; override for transparency
setw -g window-status-format '#[bg=default,fg=default] #I:#W#F '
setw -g window-status-current-format '#[bg=default,fg=brightcyan,bold] #I:#W#F '
setw -g window-status-separator ''
set -g @prefix_highlight_output_prefix ''
set -g @prefix_highlight_output_suffix ''
set -g @prefix_highlight_copy_mode_attr 'fg=brightcyan,bg=default,bold'

run '~/.config/tmux/plugins/tmux-battery/battery.tmux'
