# Shell
run-shell 'z=$(command -v zsh) && tmux set -g default-shell "$z" || true'

# General
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g default-terminal "screen-256color"
set -g focus-events on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string '#T'

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TMUX

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Key mode
set -g status-keys emacs
setw -g mode-keys vi

# Status bar
set -g status-interval 1

# Window navigation
bind C-p previous-window
bind C-n next-window
bind R source-file "~/.config/tmux/tmux.conf" \; display "tmux.conf reloaded!"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @fingers-jump-key F1

# Splits — new panes inherit current working directory
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind-key -T prefix C-g split-window \
  "$SHELL --login -i -c 'navi --print | head -c -1 | tmux load-buffer -b tmp - ; tmux paste-buffer -p -t {last} -b tmp -d'"

# Copy mode — tmux-yank (loaded by tpm below) owns `y` and already picks
# pbcopy on macOS / xsel|xclip on Linux, so no OS branch is needed to copy.
unbind [
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Paste. Last matching if-shell wins; the bare binding is the fallback when
# neither clipboard tool is installed.
bind ] paste-buffer
if-shell 'command -v xsel >/dev/null 2>&1' \
  "bind ] run 'xsel -ob | tmux load-buffer - && tmux paste-buffer'"
if-shell 'command -v pbpaste >/dev/null 2>&1' \
  "bind ] run 'pbpaste | tmux load-buffer - && tmux paste-buffer'"

# Scratch popup
bind Q display-popup -E "tmux new-session -A -s scratch; tmux set-option -g status"

# Vim-tmux-navigator — https://github.com/christoomey/vim-tmux-navigator
# (-wrapped)? is required on macOS when nvim is launched via a GUI wrapper
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" -eq 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" -eq 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Pane resize
bind -r -T prefix K resize-pane -U 5
bind -r -T prefix J resize-pane -D 5
bind -r -T prefix H resize-pane -L 5
bind -r -T prefix L resize-pane -R 5

# Status bar — styled to match ~/.p10k.zsh (rainbow powerline, transparent gaps)
#
# Colors are explicit Nord hex rather than colourNNN palette indices. An index
# resolves against whatever palette the terminal happens to carry, so the same
# config rendered differently on each machine. Hex pins it everywhere.
#
#   #434C5E nord2   pill background      #E5E9F0 nord5   primary foreground
#   #5E81AC nord10  blue accent          #D8DEE9 nord4   muted foreground
#   #EBCB8B nord13  yellow, prefix       #2E3440 nord0   darkest, text on yellow
set -g status-style 'bg=default,fg=#E5E9F0'
set -g status-left-style 'bg=default,fg=default'
set -g status-right-style 'bg=default,fg=default'
set -g status-justify left
set -g status-left-length 320
set -g status-right-length 280

# Battery + nvim status via file bridges (avoids flaky inline #() with format vars).
set -g status-left "#[fg=#E5E9F0,bg=#434C5E,bold] #(cat \"/tmp/tmux-status-$(id -u)/battery-bridge\" 2>/dev/null | tr -d '\\n') #[fg=#434C5E,bg=default] #(cat \"/tmp/tmux-status-$(id -u)/status-left-bridge\" 2>/dev/null | tr -d '\\n')"
# status-right, outward from the nvim bridge: prefix indicator, date/time, host.
# Each pill re-asserts bg=default first, so the transparent gaps survive whether
# or not prefix_highlight is currently rendering anything.
set -g status-right "#(cat \"/tmp/tmux-status-$(id -u)/status-right-bridge\" 2>/dev/null | tr -d '\\n')#{prefix_highlight}#[fg=#434C5E,bg=default]#[fg=#E5E9F0,bg=#434C5E] %Y-%m-%d #[fg=#D8DEE9]%H:%M #[fg=#5E81AC,bg=#434C5E]#[fg=#E5E9F0,bg=#5E81AC,bold] #H "

# Compact window list — long powerline pills were starving status-left/right to zero width.
setw -g window-status-format '#[fg=#D8DEE9,bg=#434C5E] #I:#W#F #[fg=#434C5E,bg=default,nobold] '
setw -g window-status-current-format '#[fg=#E5E9F0,bg=#5E81AC,bold] #I:#W#F #[fg=#5E81AC,bg=default,nobold] '
setw -g window-status-separator ''

# Prefix highlight: p10k modified/vcs yellow (#EBCB8B)
set -g @prefix_highlight_fg #2E3440
set -g @prefix_highlight_bg #EBCB8B
set -g @prefix_highlight_output_prefix '#[fg=#EBCB8B,bg=default,nobold,noitalics,nounderscore]#[fg=#2E3440,bg=#EBCB8B]'
set -g @prefix_highlight_output_suffix ''
set -g @prefix_highlight_copy_mode_attr 'fg=#2E3440,bg=#EBCB8B,bold'

# Pin the plugin directory. tpm infers it from an XDG config, but only when
# the variable is unset — and a server started before this config moved
# exports the old ~/.tmux/plugins to its panes, so a reload there would
# silently resolve to a directory that no longer exists and load nothing.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# TPM last, per its README. prefix-highlight substitutes #{prefix_highlight} in
# status-right and reads its @prefix_highlight_* options as it loads, so both
# must already be set by the time this runs.
run '~/.config/tmux/plugins/tpm/tpm'

# Panes — p10k-adjacent accents (dir blue active, muted inactive border)
set -g pane-border-style 'fg=#434C5E,bg=default'
set -g pane-active-border-style 'fg=#5E81AC,bg=default'
set -g message-style 'fg=#E5E9F0,bg=#434C5E'

run-shell -b '~/.config/tmux/scripts/battery-bridge-loop.sh'
run-shell -b '~/.config/tmux/scripts/status-bridge-loop.sh'
