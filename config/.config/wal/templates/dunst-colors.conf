# Rendered by pywal to ~/.cache/wal/dunst-colors.conf.
# Do not edit that copy - edit this template and re-run wal-reload.sh.
#
# Reaches dunst as ~/.config/dunst/dunstrc.d/99-wal.conf, which symlinks here.
# Sorting last means these override the fallback colors in the base dunstrc.
#
# Index note: this palette is generated from base16-nord.json, which is NOT in
# ANSI order - color1 is a blue, and the red is color2. The urgency mapping
# below follows the actual palette, not the convention.

[urgency_low]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color8}"

[urgency_normal]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color15}"

[urgency_critical]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color2}"
